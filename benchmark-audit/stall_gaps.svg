<title id="t">Inter-token gaps of one streamed request under a 300 ms stall</title>
<desc id="d">63 gaps between streamed tokens. Before the stall they are about 12 ms; gap 19 is 314 ms; the tokens held during the stall then arrive almost at once. The request's average gap is 11.3 ms.</desc>
