<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
<title id="t">Queue-time score of a pod after it slows down</title>
<desc id="d">Model of AIBrix scoring, 100,000 prior requests. The lifetime mean crosses the other pod's 0.5 s at 605 s; the 1-minute mean crosses it at 15 s.</desc>
<style>
  .surface{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .muted{fill:#898781}
  .grid{stroke:#e1e0d9} .axis{stroke:#898781} .ref{stroke:#898781}
  .s1{stroke:#2a78d6} .s2{stroke:#eb6834} .f1{fill:#2a78d6} .f2{fill:#eb6834} .ring{stroke:#fcfcfb}
  @media (prefers-color-scheme: dark){
    .surface{fill:#1a1a19} .ink{fill:#f0efec} .ink2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a} .s1{stroke:#3987e5} .s2{stroke:#d95926}
    .f1{fill:#3987e5} .f2{fill:#d95926} .ring{stroke:#1a1a19}
  }
  text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
</style>
<rect class="surface" width="760" height="380"/>
<text class="ink" x="64" y="24" font-size="16" font-weight="600">How long a slowed pod keeps winning the route</text>
<text class="ink2" x="64" y="43" font-size="12">Queue-time score after the pod slows from 0.05 s to 2 s at t = 0, after serving 100,000 requests.</text>
<text class="ink2" x="64" y="59" font-size="12">Model of the merged scoring rules with 5 s scrapes, not a cluster measurement.</text>
